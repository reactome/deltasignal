<svg width="300" height="60" viewBox="0 0 300 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="deltaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo mark -->
  <g transform="translate(15, 15)">
    <!-- Delta symbol with network -->
    <path d="M5 25 L15 5 L25 25 Z" fill="url(#deltaGlow)" stroke="#047857" stroke-width="1.5"/>
    
    <!-- Network nodes -->
    <circle cx="2" cy="20" r="2" fill="#3b82f6" opacity="0.7"/>
    <circle cx="28" cy="20" r="2" fill="#3b82f6" opacity="0.7"/>
    <circle cx="15" cy="2" r="1.8" fill="#fbbf24" opacity="0.8"/>
    <circle cx="10" cy="28" r="1.5" fill="#ef4444" opacity="0.7"/>
    <circle cx="20" cy="28" r="1.5" fill="#ef4444" opacity="0.7"/>
    
    <!-- Connections -->
    <line x1="4" y1="20" x2="12" y2="8" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>
    <line x1="26" y1="20" x2="18" y2="8" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>
    <line x1="2" y1="22" x2="9" y2="26" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>
    <line x1="28" y1="22" x2="21" y2="26" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>
  </g>
  
  <!-- Main text -->
  <text x="65" y="38" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="28" font-weight="700" fill="url(#textGradient)">
    DeltaSignal
  </text>
  
  <!-- Beta badge -->
  <rect x="260" y="20" width="30" height="16" rx="8" fill="#10b981" opacity="0.9"/>
  <text x="275" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="600" 
        fill="white" text-anchor="middle">
    BETA
  </text>
</svg>