<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark mode gradient -->
    <linearGradient id="primaryGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Delta gradient for dark mode -->
    <linearGradient id="deltaGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle for the logo mark -->
  <circle cx="30" cy="40" r="25" fill="url(#primaryGradientDark)" opacity="0.15"/>
  
  <!-- Delta symbol (Δ) - representing change/perturbation -->
  <path d="M20 55 L30 25 L40 55 Z" fill="url(#deltaGradientDark)" stroke="#10b981" stroke-width="1.5"/>
  
  <!-- Network nodes around delta -->
  <circle cx="15" cy="35" r="3" fill="#60a5fa" opacity="0.8"/>
  <circle cx="45" cy="35" r="3" fill="#60a5fa" opacity="0.8"/>
  <circle cx="30" cy="20" r="2.5" fill="#34d399" opacity="0.9"/>
  <circle cx="25" cy="50" r="2.5" fill="#f87171" opacity="0.8"/>
  <circle cx="35" cy="50" r="2.5" fill="#f87171" opacity="0.8"/>
  
  <!-- Network connections -->
  <line x1="18" y1="35" x2="27" y2="27" stroke="#94a3b8" stroke-width="1.5" opacity="0.7"/>
  <line x1="42" y1="35" x2="33" y2="27" stroke="#94a3b8" stroke-width="1.5" opacity="0.7"/>
  <line x1="15" y1="38" x2="27" y2="47" stroke="#94a3b8" stroke-width="1.5" opacity="0.7"/>
  <line x1="45" y1="38" x2="33" y2="47" stroke="#94a3b8" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Activation arrows -->
  <path d="M27 29 L25 31 M27 29 L29 31" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M33 29 L31 31 M33 29 L35 31" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Inhibition markers -->
  <line x1="25" y1="45" x2="25" y2="47" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="45" x2="35" y2="47" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Text logo -->
  <text x="65" y="35" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#e2e8f0">
    DeltaSignal
  </text>
  
  <!-- Tagline -->
  <text x="65" y="52" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
    Pathway Perturbation &amp; Dynamics
  </text>
  
  <!-- Version indicator -->
  <rect x="170" y="25" width="25" height="12" rx="6" fill="#34d399" opacity="0.9"/>
  <text x="182.5" y="33" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#065f46" text-anchor="middle">
    v1.0
  </text>
</svg>