# Production Docker Compose — DeltaSignal engine + HTTP API only.
#
# The frontend now lives in the WebsiteAngular workspace; this repo ships the
# solver and its HTTP API (see docs/API.md). TLS termination, a reverse proxy,
# and serving the UI are handled by the WebsiteAngular deployment, not here —
# so this file is intentionally a single service.
#
# The winning solver config is baked into the code defaults (no DS_* env
# needed). Override any DS_* var here only for experiments.
#
# Usage: docker compose -f docker-compose.prod.yml up

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: julia-builder
    command: julia --project=/app /app/src/api/server.jl --port=8080 --host=0.0.0.0
    ports:
      - "8080:8080"
    environment:
      - JULIA_NUM_THREADS=4
      - JULIA_ENV=production
      # Restrict to the UI's origin in a real deployment (default "*").
      - DS_CORS_ORIGIN=${DS_CORS_ORIGIN:-*}
    volumes:
      - ./examples:/app/examples:ro
      - api_data:/app/data
      # Pre-generated Reactome pathway catalog (for GET /api/pathways). Point
      # PATHWAY_CATALOG at the generated catalog dir; /api/pathways returns an
      # empty list if unset.
      # - ${PATHWAY_CATALOG:-./data/catalog}:/app/pathway_catalog:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  api_data:
    driver: local
