[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx_stderr.log
stdout_logfile=/var/log/supervisor/nginx_stdout.log

[program:deltasignal-api]
command=julia --project=/app /app/src/api/server.jl --port=8080 --host=127.0.0.1
directory=/app
autostart=true
autorestart=true
user=root
stderr_logfile=/var/log/supervisor/deltasignal_stderr.log
stdout_logfile=/var/log/supervisor/deltasignal_stdout.log
environment=JULIA_NUM_THREADS=4