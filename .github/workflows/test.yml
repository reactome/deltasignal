name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bench:
    name: bench suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        # The bench suite is stdlib-only: py2neo is imported lazily inside the
        # functions that talk to Neo4j, so nothing here needs a database.
        run: python -m pip install --upgrade pip pytest
      - name: Run the bench suite
        run: python -m pytest bench/ -q

  julia:
    name: solver assertions (Julia ${{ matrix.julia }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10"]   # LTS, per Project.toml
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run the suites that actually assert
        # The suites that assert are listed in test/asserting_suites.txt --
        # a single source of truth shared with the docker test-runner and with
        # the count check below, so they cannot drift apart. The other seven
        # files in test/ execute code and print, and pass whatever the code
        # does, so running them proves nothing.
        #
        # Deliberately NO DS_* environment here. The code defaults ARE the
        # validated config and the suites pin them; setting overrides in CI
        # would measure a configuration production never runs, which is exactly
        # how docker-compose.dev.yml drifted for six days.
        run: |
          # pipefail is load-bearing: the suite is piped through tee so its
          # output can be checked afterwards, and without this the `if` would
          # test tee's exit status and report a failing suite as PASSED.
          set -u -o pipefail
          failed=""
          mkdir -p test-output
          suites=$(grep -v "^#" test/asserting_suites.txt | grep -v "^$")
          for f in $suites; do
            echo "::group::test/$f.jl"
            if julia --project=. "test/$f.jl" 2>&1 | tee "test-output/$f.out"; then
              echo "  $f PASSED"
            else
              echo "  $f FAILED"
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failing suites:$failed"
            exit 1
          fi

      - name: CLAUDE.md's assertion table must match what the suites printed
        # Three counts in that table were wrong from the day they were written
        # and survived months, while the table claimed to be CI-verified.
        # The numbers are printed every run; this turns them into an assertion.
        run: python3 scripts/check_doc_counts.py test-output

      - name: No dangling quotes in markdown
        # A bulk paraphrasing pass once left five closing quotes stranded --
        # it rewrote an attribution and the first line of a multi-line quote
        # and left the rest behind. Cheap to check, invisible to review.
        run: python3 scripts/check_quote_balance.py
